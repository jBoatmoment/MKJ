<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - BokoHacks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Add Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
</head>
<body>
    <div id="admin-root"></div>

    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import AdminInterface from "{{ url_for('static', filename='js/AdminInterface.js') }}";

        const root = ReactDOM.createRoot(document.getElementById('admin-root'));
        root.render(React.createElement(AdminInterface));
    </script>
</body>
</html>
